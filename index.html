<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema Dra. Rubiana</title>

<style>
body { font-family: Arial; background:#f2f2f2; padding:20px; }
.card { background:white; padding:15px; margin-top:10px; border-radius:10px; }
button { background:#8e3a59; color:white; border:none; padding:8px; border-radius:5px; margin-top:5px; }
input, select, textarea { width:100%; padding:8px; margin-top:5px; }
</style>

</head>

<body>

<h2>💙 Sistema Dra. Rubiana</h2>

<div class="card">
<h3>Novo Paciente</h3>
<input id="nome" placeholder="Nome">
<select id="tipo">
<option>Clínica</option>
<option>ILPI</option>
</select>
<button onclick="addPaciente()">Adicionar</button>
</div>

<div id="lista"></div>

<script>

let pacientes = JSON.parse(localStorage.getItem("pacientes")) || []

function salvar(){
  localStorage.setItem("pacientes", JSON.stringify(pacientes))
}

function addPaciente(){
  let nome = document.getElementById("nome").value
  let tipo = document.getElementById("tipo").value

  if(!nome) return

  pacientes.push({nome, tipo, evolucoes: []})
  salvar()
  render()
}

function addEvolucao(i){

  let humor = prompt("Humor:")
  let comportamento = prompt("Comportamento:")
  let obs = prompt("Observações:")

  pacientes[i].evolucoes.push({
    humor,
    comportamento,
    obs,
    data: new Date().toLocaleDateString()
  })

  salvar()
  render()
}

function whatsapp(nome){
  let msg = `Olá ${nome}, confirmando sua sessão.`
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`)
}

function render(){

  let html = ""

  pacientes.forEach((p,i)=>{

    html += `
    <div class="card">
      <h3>${p.nome} (${p.tipo})</h3>

      <button onclick="addEvolucao(${i})">Nova Evolução</button>
      <button onclick="whatsapp('${p.nome}')">WhatsApp</button>

      ${p.evolucoes.map(e=>`
        <p><b>${e.data}</b><br>
        Humor: ${e.humor}<br>
        Comportamento: ${e.comportamento}<br>
        Obs: ${e.obs}</p>
      `).join("")}

    </div>
    `
  })

  document.getElementById("lista").innerHTML = html
}

render()

</script>

</body>
</html>
